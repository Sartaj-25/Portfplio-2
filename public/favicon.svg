<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#09090B" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#gradient)" stroke-width="2" stroke-opacity="0.4" />
  <!-- Monogram SA -->
  <path d="M 32 38 C 32 32, 48 30, 48 38 C 48 46, 28 46, 28 58 C 28 66, 44 68, 48 62" stroke="url(#gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 54 66 L 68 34 L 82 66 M 58 58 L 78 58" stroke="url(#gradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="38" stroke="url(#gradient)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3" />
</svg>